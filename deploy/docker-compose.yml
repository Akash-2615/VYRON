# Optional local Postgres for FaceTrack.
#   docker compose up -d db
# Default DSN (also in config.json):
#   postgresql://facetrack:facetrack@localhost:5432/facetrack
services:
  db:
    image: postgres:16-alpine
    container_name: facetrack-pg
    environment:
      POSTGRES_USER: facetrack
      POSTGRES_PASSWORD: facetrack
      POSTGRES_DB: facetrack
    ports:
      - "5432:5432"
    volumes:
      - facetrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facetrack -d facetrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  facetrack_pgdata:
